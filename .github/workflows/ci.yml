name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: build + vet + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # ffmpeg is preinstalled on all three runners, so the end-to-end video
        # tests (which synthesize real mp4s) actually run, not just skip.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -v ./...
